# Lint configuration for the Kalshi daemon.
#
# Scoped to rules that catch defects, not rules that restyle working code.
# A lint run that reports 182 findings on a codebase with no bugs in it is a
# lint run everybody learns to skip, and then the one real finding scrolls
# past with the other 181.
line-length = 110

[lint]
select = [
    "F",      # pyflakes: undefined names, unused imports, f-strings with no
              # placeholders — the class of typo that reaches production
    "E4",     # import shadowing
    "E7",     # comparison and statement errors (== None, bare semicolons)
    "E9",     # syntax / IO errors
    "B",      # bugbear: mutable default args, loop-variable capture in
              # closures, except-without-raise-from, assert-on-tuple
    "S105",   # hardcoded password/secret assigned to a variable
    "S106",   # hardcoded secret passed as an argument
]
ignore = [
    "B008",   # function call in a default argument — the dataclass field
              # defaults in config.py read os.getenv deliberately at import
    "B905",   # zip(strict=) — not required at this Python floor
]

[lint.per-file-ignores]
# Tests construct fakes with obviously-fake credentials, which is exactly
# what a test should do; flagging them trains people to ignore S-rules.
"tests/**" = ["S105", "S106", "B011"]
